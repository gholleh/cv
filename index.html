<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d9488">
  <meta name="description" content="رزومهٔ محسن قله؛ سرپرست تیم سئو و متخصص AEO و SEO | Mohsen Gholleh's bilingual résumé">
  <title>محسن قله | رزومه</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { color-scheme: light; --ink:#171f26; --muted:#596672; --teal:#0d9488; --line:#e0e7e6; --paper:#f7f8f7; --card:#fff; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--paper); color:var(--ink); font:400 15px/1.75 Vazirmatn,Tahoma,sans-serif; }
    html[lang="en"] body { font-family:Manrope,Arial,sans-serif; line-height:1.65; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    a { color:inherit; }
    :focus-visible { outline:3px solid var(--teal); outline-offset:3px; }
    .container { width:min(1100px,calc(100% - 40px)); margin-inline:auto; }
    .topbar { position:sticky; top:0; z-index:10; background:rgba(247,248,247,.96); border-bottom:1px solid var(--line); backdrop-filter:blur(12px); }
    .topbar-inner { display:flex; align-items:center; gap:20px; min-height:72px; }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; white-space:nowrap; text-decoration:none; }
    .brand img { width:36px; height:36px; object-fit:cover; border-radius:50%; }
    .nav { display:flex; align-items:center; gap:4px; overflow-x:auto; margin-inline:auto; scrollbar-width:thin; }
    .nav a { display:block; padding:7px 11px; border-radius:8px; color:#3d4750; text-decoration:none; white-space:nowrap; font-size:13px; font-weight:700; }
    .nav a:hover,.nav a:focus-visible { background:#e5f4f1; color:#087a70; }
    .actions { display:flex; gap:8px; align-items:center; flex:none; }
    .action,.choice { border:1px solid #cad4d3; background:white; color:#30404a; border-radius:9px; padding:7px 12px; font-size:12px; font-weight:700; white-space:nowrap; }
    .action:hover,.choice:hover { border-color:var(--teal); }
    .languages { display:flex; gap:3px; padding:3px; border:1px solid var(--line); border-radius:10px; background:white; }
    .languages button { border:0; background:none; border-radius:7px; padding:5px 10px; color:var(--muted); font-size:12px; font-weight:800; }
    .languages button[aria-pressed="true"] { background:var(--teal); color:white; }
    .hero { padding-block:58px 44px; }
    .eyebrow,.section-number { color:var(--teal); font-size:12px; font-weight:800; letter-spacing:.04em; }
    .identity { display:flex; align-items:flex-start; gap:22px; margin-top:20px; }
    .portrait { width:104px; height:104px; border:3px solid white; border-radius:50%; object-fit:cover; box-shadow:0 3px 14px #1a2c3020; flex:none; }
    h1 { margin:0 0 4px; font-size:clamp(30px,5vw,42px); line-height:1.35; letter-spacing:-.025em; }
    .role { color:var(--teal); font-size:18px; font-weight:800; }
    .current { margin:10px 0 19px; color:var(--muted); }
    .current::before { content:""; display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--teal); margin-inline-end:8px; }
    .contacts { display:flex; flex-wrap:wrap; gap:9px; }
    .contacts a,.location { display:inline-flex; align-items:center; padding:8px 13px; border-radius:9px; background:white; border:1px solid var(--line); text-decoration:none; font-size:13px; }
    .contacts a:hover { border-color:var(--teal); color:#087a70; }
    .latin { direction:ltr; unicode-bidi:isolate; display:inline-block; }
    section { padding-block:37px 55px; border-top:1px solid var(--line); scroll-margin-top:85px; }
    h2 { font-size:clamp(24px,3vw,29px); line-height:1.4; margin:4px 0 22px; }
    h3 { font-size:16px; line-height:1.55; margin:0; }
    p { margin:0; }
    .overview-grid { display:grid; grid-template-columns:1.35fr 1fr; gap:32px; }
    .summary { font-size:16px; line-height:1.9; max-width:650px; }
    .subheading { font-size:13px; font-weight:800; color:var(--muted); margin:24px 0 12px; }
    .samples { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:13px; box-shadow:0 1px 3px #17272a09; padding:19px; }
    .sample { text-decoration:none; display:block; padding:15px; }
    .sample:hover { border-color:var(--teal); transform:translateY(-2px); }
    .sample small,.muted { color:var(--muted); }
    .sample small { display:block; font-size:12px; margin-top:3px; }
    .fact { display:flex; justify-content:space-between; gap:15px; margin-top:8px; font-size:13px; }
    .fact span:first-child { color:var(--muted); }
    .fact span:last-child { text-align:end; font-weight:700; }
    .section-head { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:22px; }
    .section-head h2 { margin-bottom:0; }
    .filters { display:flex; gap:7px; flex-wrap:wrap; }
    .choice[aria-pressed="true"] { color:#087a70; border-color:var(--teal); background:#e5f4f1; }
    .timeline { border-inline-start:1px solid #c4d0ce; margin-inline-start:6px; padding-inline-start:24px; display:grid; gap:14px; }
    .job { position:relative; }
    .job::before { content:""; position:absolute; inset-inline-start:-31px; top:19px; width:10px; height:10px; border:2px solid var(--teal); background:var(--paper); border-radius:50%; }
    .job-head,.course-head { display:flex; justify-content:space-between; align-items:start; gap:12px; }
    .period,.meta { font-size:12px; color:var(--muted); margin-top:7px; }
    .badge { display:inline-block; flex:none; color:#087a70; background:#e5f4f1; border-radius:7px; padding:3px 9px; font-size:11px; font-weight:700; }
    .badge.past { background:#eef1f1; color:#647078; }
    .language-level { width:min(420px,100%); display:flex; justify-content:space-between; margin-bottom:24px; }
    .skills-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:18px 24px; }
    .skill-top { display:flex; justify-content:space-between; gap:8px; font-size:13px; }
    .skill-top span:last-child { color:var(--muted); }
    .bar { height:6px; background:#e7edeb; border-radius:6px; margin-top:7px; overflow:hidden; }
    .bar span { display:block; height:100%; background:var(--teal); border-radius:6px; }
    .tags { display:flex; flex-wrap:wrap; gap:8px; }
    .tag { font-size:12px; padding:5px 11px; border:1px solid var(--line); background:white; border-radius:8px; }
    .education { max-width:680px; display:flex; justify-content:space-between; gap:15px; flex-wrap:wrap; }
    .course-controls { display:flex; align-items:center; flex-wrap:wrap; gap:12px; margin-bottom:20px; }
    .course-controls input { min-width:220px; width:min(300px,100%); border:1px solid #cad4d3; background:white; border-radius:9px; padding:9px 12px; color:var(--ink); }
    .courses { display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:13px; }
    .course { min-height:142px; display:flex; flex-direction:column; }
    .course-foot { margin-top:auto; padding-top:10px; display:flex; justify-content:space-between; align-items:center; }
    .empty { color:var(--muted); padding:28px; text-align:center; }
    footer { border-top:1px solid var(--line); padding:24px 0 40px; color:var(--muted); font-size:13px; }
    footer .container { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; }
    @media(max-width:800px) { .topbar-inner { flex-wrap:wrap; gap:6px 12px; padding-block:9px; } .nav { order:3; width:100%; margin:0; } .actions { margin-inline-start:auto; } .overview-grid { grid-template-columns:1fr; } }
    @media(max-width:540px) { .container { width:min(100% - 28px,1100px); } .brand span { font-size:13px; } .action { padding:6px 8px; } .hero { padding-top:35px; } .identity { gap:14px; } .portrait { width:72px; height:72px; } .role { font-size:15px; } .samples { grid-template-columns:1fr; } section { padding-block:30px 45px; } }
    @media print { @page { margin:14mm; } body { background:white; font-size:11px; } .container { width:100%; } .topbar,.filters,.course-controls,.action { display:none!important; } .hero { padding-block:8px 18px; } section { padding-block:14px 20px; break-inside:avoid; } .card { box-shadow:none; break-inside:avoid; } .timeline,.courses,.skills-grid { break-inside:auto; } .job,.course { break-inside:avoid; } h2 { font-size:19px; } .portrait { width:70px; height:70px; } a { text-decoration:none; } }
  </style>
</head>

    const state = {lang:'fa',experience:'all',skill:'all',category:'all',query:''};
    const t = () => copy[state.lang];
    function buttons(container, values, current, label, onSelect) {
      container.replaceChildren(...values.map(([value,text]) => {
        const button=document.createElement('button'); button.type='button'; button.className='choice';
        button.textContent=text; button.setAttribute('aria-pressed', String(value===current));
        button.addEventListener('click',()=>onSelect(value)); return button;
      }));
      container.setAttribute('aria-label',label);
    }
    function render() {
      const language=state.lang, l=t();
      document.documentElement.lang=language; document.documentElement.dir=language==='fa'?'rtl':'ltr';
      document.title=`${l.name} | ${language==='fa'?'رزومه':'Résumé'}`;
      document.querySelector('meta[name="description"]').content=language==='fa'?`رزومهٔ ${l.name}؛ سرپرست تیم سئو و متخصص AEO`:`${l.name} — SEO team lead and AEO specialist`;
      document.querySelectorAll('[data-lang]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.lang===language)));
      $('nav').setAttribute('aria-label',language==='fa'?'بخش‌های رزومه':'Résumé sections');
      $('nav').innerHTML=l.nav.map((name,i)=>`<a href="#${['overview','experience','skills','education','courses'][i]}">${escapeHTML(name)}</a>`).join('');
      $('brand-name').textContent=$('name').textContent=l.name;
      $('role').textContent=l.role; $('current').textContent=l.current; $('location').textContent=l.location;
      $('hero-kicker').textContent=l.kicker; $('print').textContent=l.print;
      ['overview','experience','skills','education','courses'].forEach((id,i)=>{ $(id+'-kicker').textContent=l.sectionKickers[i]; $(id+'-title').textContent=l.headings[i]; });
      $('summary').textContent=l.summary; $('samples-title').textContent=l.samples; $('facts-title').textContent=l.facts;
      $('samples').innerHTML=samples.map(s=>`<a class="card sample" href="${escapeHTML(s.href)}" target="_blank" rel="noopener noreferrer"><strong class="latin">${escapeHTML(s.label)}</strong><small>${escapeHTML(s[language])}</small></a>`).join('');
      $('facts').innerHTML=l.factLabels.map((label,i)=>`<div class="fact"><span>${escapeHTML(label)}</span><span>${escapeHTML(l.factValues[i])}</span></div>`).join('');
      buttons($('experience-filters'),[['all',l.all],['current',l.currentFilter],['past',l.past]],state.experience,l.headings[1],v=>{state.experience=v;render();});
      $('jobs').innerHTML=jobs.filter(j=>state.experience==='all'||(state.experience==='current')===!!j.current).map(j=>`<article class="card job"><div class="job-head"><div><h3>${escapeHTML(j[language])}</h3><div class="muted">${escapeHTML(language==='fa'?(j.companyFa||j.company):j.company)} · ${escapeHTML(language==='fa'?j.placeFa:j.placeEn)}</div></div><span class="badge ${j.current?'':'past'}">${j.current?l.currentFilter:l.past}</span></div><div class="period">${escapeHTML(language==='fa'?j.fromFa:j.fromEn)} – ${escapeHTML(language==='fa'?j.toFa:j.toEn)}</div></article>`).join('');
      $('language-level').innerHTML=`<strong>${escapeHTML(l.language)}</strong><span class="badge">${escapeHTML(l.intermediate)}</span>`;
      $('software-title').textContent=l.software; $('tags-title').textContent=l.tags;
      buttons($('skill-filters'),[['all',l.all],['advanced',l.advanced],['intermediate',l.intermediate],['basic',l.basic]],state.skill,l.software,v=>{state.skill=v;render();});
      $('software').innerHTML=software.filter(s=>state.skill==='all'||s[1]===state.skill).map(s=>`<div><div class="skill-top"><strong class="latin">${escapeHTML(s[0])}</strong><span>${escapeHTML(l[s[1]])}</span></div><div class="bar" role="img" aria-label="${escapeHTML(s[0]+' — '+l[s[1]])}"><span style="width:${s[2]}%"></span></div></div>`).join('');
      $('tags').innerHTML=tags.map(s=>`<span class="tag">${escapeHTML(s[language==='fa'?0:1])}</span>`).join('');
      $('degree').innerHTML=`<div><h3>${escapeHTML(l.degree)}</h3><div class="muted">${escapeHTML(l.field)}</div><div class="period">${escapeHTML(l.degreePeriod)}</div></div><span class="badge">${escapeHTML(l.gpa)}</span>`;
      $('course-search').placeholder=l.search; $('course-search').setAttribute('aria-label',l.search); $('course-search').value=state.query;
      buttons($('course-filters'),Object.entries(l.categories),state.category,l.headings[4],v=>{state.category=v;render();});
      renderCourses(); $('footer-name').textContent=l.footer;
    }
    function renderCourses() {
      const language=state.lang, l=t(), q=state.query.trim().toLocaleLowerCase();
      const visible=courses.filter(c=>(state.category==='all'||c[7]===state.category)&&(!q||[c[0],c[1],c[2],c[3]].some(x=>x.toLocaleLowerCase().includes(q))));
      $('course-count').textContent=l.count(visible.length);
      $('course-list').innerHTML=visible.length?visible.map(c=>`<article class="card course"><div class="course-head"><h3>${escapeHTML(c[language==='fa'?0:1])}</h3><span class="meta">${language==='fa'?faNumber(c[4]):c[4]}</span></div><div class="muted">${escapeHTML(c[language==='fa'?2:3])}</div><div class="course-foot"><span class="meta">${escapeHTML(l.duration(c[5]))}</span>${c[6]?`<span class="badge">${escapeHTML(l.certified)}</span>`:''}</div></article>`).join(''):`<p class="card empty">${escapeHTML(l.empty)}</p>`;
    }
    document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{state.lang=button.dataset.lang;render();}));
    $('course-search').addEventListener('input',e=>{state.query=e.target.value;renderCourses();});
    $('print').addEventListener('click',()=>window.print());
    let printState;
    window.addEventListener('beforeprint',()=>{printState={experience:state.experience,skill:state.skill,category:state.category,query:state.query};Object.assign(state,{experience:'all',skill:'all',category:'all',query:''});render();});
    window.addEventListener('afterprint',()=>{if(printState){Object.assign(state,printState);printState=null;render();}});
    render();
  </script>
